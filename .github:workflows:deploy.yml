name: Deploy to GoDaddy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTPS Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            README.md
            documents/**
            Documentation/**
            config.sample.php
            .DS_Store
      - name: Retry on failure
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            README.md
            documents/**
            Documentation/**
            config.sample.php
            .DS_Store